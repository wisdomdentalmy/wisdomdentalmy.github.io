    <style>
        /* CSS Variables for easy color customization */
        :root {
            --bg-color: #f3f4f6; /* Background color */
            --text-color: #ffffff; /* Main text color */
            --button-bg: #f9fff5; /* Button background */
            --button-text: #000000; /* Button text */
            --button-hover-bg: #e5e7eb; /* Button hover background */
            --button-border: #d1d5db; /* Button border */
            --button-shadow: rgba(0, 0, 0, 100);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, #878787, #800020);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 680px; /* Standard Linktree max width */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Section */
        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,100);
        }

        .profile-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 100);
        }

        .profile-bio {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 100);
        }

        /* Links Section */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Space between buttons */
        }

        .link-btn {
            position: relative; /* Added to constrain absolute child */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 25px 45px; /* Slightly increased side padding so text doesn't hit the icon */
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            font-size: 19px;
            font-weight: 700;
            text-shadow: 0.5px 0.5px 0.5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--button-border);
            border-radius: 15px; /* Change to 30px for pill-shaped buttons */
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 15px var(--button-shadow);
        }

        .link-btn:hover {
            background-color: var(--button-hover-bg);
            transform: scale(1.03);
        }

        /* New Icon Class */
        .link-icon {
            position: absolute;
            left: 40px; /* Distance from the left edge */
            font-size: 40px; /* Icon size */
            color: var(--button-text);
        }

        /* Social Icons Section */
        .social-container {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-color);
            transition: transform 0.2s ease;
        }
        
        .social-icon:hover {
            transform: scale(1.1);
        }

    </style>
</head>
