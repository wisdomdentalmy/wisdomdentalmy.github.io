<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom Dental</title>
    <style>
        /* CSS Variables for easy color customization */
        :root {
            --bg-color: #f3f4f6; /* Background color */
            --text-color: #1f2937; /* Main text color */
            --button-bg: #ffffff; /* Button background */
            --button-text: #1f2937; /* Button text */
            --button-hover-bg: #e5e7eb; /* Button hover background */
            --button-border: #d1d5db; /* Button border */
            --button-shadow: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 680px; /* Standard Linktree max width */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Section */
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            /* Optional: adds a subtle ring around the logo */
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .profile-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .profile-bio {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 32px;
            color: #4b5563;
        }

        /* Links Section */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px; /* Space between buttons */
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--button-border);
            border-radius: 8px; /* Change to 30px for pill-shaped buttons */
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 8px var(--button-shadow);
        }

        .link-btn:hover {
            background-color: var(--button-hover-bg);
            transform: scale(1.02); /* Slight zoom effect on hover */
        }

        /* Social Icons Section (Optional bottom row) */
        .social-container {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-color);
            transition: transform 0.2s ease;
        }
        
        .social-icon:hover {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Replace with your actual logo URL -->
        <img src="https://via.placeholder.com/150" alt="Wisdom Dental Logo" class="profile-img">
        
        <!-- 2. Profile Name and Bio -->
        <h1 class="profile-title">@wisdomdental</h1>
        <p class="profile-bio">Smile with confidence! Serving the community with gentle dental care.</p>
        
        <!-- 3. Your Links -->
        <div class="links-container">
            <a href="https://yourwebsite.com/book" class="link-btn" target="_blank" rel="noopener noreferrer">
                Book an Appointment
            </a>
            <a href="https://yourwebsite.com/services" class="link-btn" target="_blank" rel="noopener noreferrer">
                Our Services
            </a>
            <a href="https://yourwebsite.com/contact" class="link-btn" target="_blank" rel="noopener noreferrer">
                Contact Us / Location
            </a>
            <a href="https://yourwebsite.com/promotions" class="link-btn" target="_blank" rel="noopener noreferrer">
                New Patient Specials
            </a>
        </div>

    </div>

</body>
</html>
